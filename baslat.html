<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>MineHost - Sunucu Paneli</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        // GÜVENLİK KONTROLÜ: Giriş yapılmadıysa index'e at
        if (localStorage.getItem('isLoggedIn') !== 'true') {
            window.location.href = 'index.html';
        }
    </script>
    <style>
        body { background-color: #090d16; color: #e2e8f0; font-family: sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body class="p-4 md:p-12">
    <nav class="max-w-6xl mx-auto flex justify-between items-center mb-10">
        <div class="text-xl font-bold">MINE<span class="text-green-500">HOST</span></div>
        <div class="flex items-center space-x-4">
            <span id="user-display" class="text-slate-400 text-sm italic"></span>
            <button onclick="localStorage.clear(); location.reload();" class="text-xs bg-red-500/10 text-red-500 px-3 py-1 rounded border border-red-500/20">Çıkış Yap</button>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto">
        <section id="step-wizard" class="glass p-8 rounded-3xl shadow-2xl">
            <h2 class="text-2xl font-bold mb-6 text-center">Sunucu Kurulumu</h2>
            <form onsubmit="handleWizardSubmit(event)" class="space-y-6">
                <div class="grid md:grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <label class="text-sm text-slate-400">Sunucu Adı</label>
                        <input type="text" id="server-name-input" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 outline-none focus:border-green-500">
                    </div>
                    <div class="space-y-2">
                        <label class="text-sm text-slate-400">Sunucu Türü</label>
                        <select id="server-type-select" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 outline-none focus:border-green-500">
                            <option value="vanilla">Vanilla</option>
                            <option value="paper">Paper (Plugin Destekli)</option>
                        </select>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-sm text-slate-400">Oyun Sürümü (26.1.2 - 1.0)</label>
                    <select id="server-version-select" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 outline-none focus:border-green-500">
                        <optgroup label="Özel Sürümler">
                            <option value="26.1.2">26.1.2</option>
                            <option value="26.1.1">26.1.1</option>
                            <option value="26.1">26.1</option>
                        </optgroup>
                        <optgroup label="1.21 Serisi">
                            <option value="1.21.11">1.21.11</option>
                            <option value="1.21.10">1.21.10</option>
                            <option value="1.21.9">1.21.9</option>
                        </optgroup>
                        <optgroup label="Eski Sürümler">
                            <option value="1.5.2">1.5.2</option>
                            <option value="1.1">1.1</option>
                            <option value="1.0">1.0</option>
                        </optgroup>
                    </select>
                </div>

                <div class="space-y-2">
                    <label class="text-sm text-slate-400">Alan Adı (Arkadaşlarınla Paylaşacağın IP)</label>
                    <div class="flex">
                        <input type="text" id="domain-sub-input" required placeholder="umutsmp" class="flex-grow bg-slate-900 border border-slate-700 rounded-l-xl px-4 py-3 outline-none focus:border-green-500">
                        <span class="bg-slate-800 border border-l-0 border-slate-700 rounded-r-xl px-4 py-3 text-slate-400">.free.minehost.me</span>
                    </div>
                </div>

                <button type="submit" class="w-full bg-green-500 hover:bg-green-400 text-slate-950 font-bold py-4 rounded-xl shadow-lg transition-all">
                    AŞAMAYI TAMAMLA VE PANELİ AÇ
                </button>
            </form>
        </section>

        <section id="step-panel" class="hidden space-y-6">
            <div class="glass p-6 rounded-2xl flex justify-between items-center border-l-4 border-green-500">
                <div>
                    <h2 id="display-name" class="text-xl font-bold">---</h2>
                    <p id="display-domain" class="text-sm text-slate-400 font-mono">---</p>
                </div>
                <div id="status-badge" class="px-4 py-1.5 rounded-full text-xs font-black uppercase bg-slate-800 text-slate-500">Çevrimdışı</div>
            </div>

            <div class="grid lg:grid-cols-3 gap-6">
                <div class="glass p-6 rounded-2xl flex flex-col space-y-4">
                    <button id="btn-start" onclick="startServer()" class="flex-1 bg-green-500 text-slate-950 font-bold py-3 rounded-xl hover:scale-105 transition-transform">BAŞLAT</button>
                    <button id="btn-stop" onclick="stopServer()" class="flex-1 bg-slate-800 text-slate-500 font-bold py-3 rounded-xl cursor-not-allowed">DURDUR</button>
                </div>
                <div class="lg:col-span-2 glass p-4 rounded-2xl h-64 flex flex-col">
                    <div id="console" class="flex-grow bg-black/50 rounded-lg p-4 font-mono text-[11px] text-green-400 overflow-y-auto">
                        > Oturum açıldı: Sistem komut bekliyor...
                    </div>
                </div>
            </div>
        </main>
    </main>

    <script src="sunucu.js"></script>
</body>
</html>
