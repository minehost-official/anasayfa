<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>MineHost - Giriş Yap</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #090d16; font-family: 'Plus Jakarta Sans', sans-serif; color: white; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center">
    <div class="glass p-8 rounded-2xl w-full max-w-md shadow-2xl">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold">MINE<span class="text-green-500">HOST</span></h1>
            <p class="text-slate-400 mt-2">Sunucunu yönetmek için hesap oluştur.</p>
        </div>
        
        <form id="auth-form" class="space-y-4">
            <div>
                <label class="block text-sm mb-1 text-slate-300">Kullanıcı Adı</label>
                <input type="text" id="username" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 focus:border-green-500 outline-none">
            </div>
            <div>
                <label class="block text-sm mb-1 text-slate-300">Şifre</label>
                <input type="password" id="password" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 focus:border-green-500 outline-none">
            </div>
            <button type="submit" class="w-full bg-green-500 hover:bg-green-400 text-slate-950 font-bold py-3 rounded-lg transition-all">
                Hesap Oluştur ve Giriş Yap
            </button>
        </form>
    </div>

    <script>
        document.getElementById('auth-form').onsubmit = (e) => {
            e.preventDefault();
            const user = document.getElementById('username').value;
            // Basit bir oturum kaydı (Tarayıcı hafızasına)
            localStorage.setItem('minehost_user', user);
            localStorage.setItem('isLoggedIn', 'true');
            window.location.href = 'baslat.html';
        };
    </script>
</body>
</html>
