<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MineHost - Sunucu Kontrol Merkezi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #090d16; color: #e2e8f0; }
        .glass { background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .glow-green { box-shadow: 0 0 20px rgba(34, 197, 94, 0.15); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <nav class="glass sticky top-0 z-50 border-b border-slate-800">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <div class="w-10 h-10 bg-green-500 rounded-lg flex items-center justify-center text-slate-950 font-bold text-xl">M</div>
                <span class="text-xl font-bold tracking-wider text-white">MINE<span class="text-green-500">HOST</span></span>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-6xl w-full mx-auto px-4 py-12">
        
        <section id="step-wizard" class="max-w-xl mx-auto">
            <div class="glass p-8 rounded-2xl border border-slate-800/80 space-y-6 glow-green">
                <div class="text-center space-y-2">
                    <h2 class="text-2xl font-bold text-white">Sunucu Yapılandırma</h2>
                    <p class="text-slate-400 text-sm">26.1.2 ve 1.0 aralığındaki tüm sürümler aktif.</p>
                </div>

                <form onsubmit="handleWizardSubmit(event)" class="space-y-5">
                    <div class="space-y-2">
                        <label class="block text-sm font-medium text-slate-300">Sunucu Adı</label>
                        <input type="text" id="server-name-input" required placeholder="Örn: UmutSMP" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-green-500">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div class="space-y-2">
                            <label class="block text-sm font-medium text-slate-300">Sunucu Türü</label>
                            <select id="server-type-select" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-green-500">
                                <option value="vanilla">Vanilla (Sade)</option>
                                <option value="paper">Paper (Plugin)</option>
                                <option value="forge">Forge (Modlu)</option>
                                <option value="fabric">Fabric (Modlu)</option>
                            </select>
                        </div>
                        <div class="space-y-2">
                            <label class="block text-sm font-medium text-slate-300">Oyun Sürümü</label>
                            <select id="server-version-select" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-green-500">
                                <optgroup label="Ultra/Gelecek Sürümler">
                                    <option value="26.1.2">26.1.2 (Ultra High)</option>
                                    <option value="25.0.0">25.0.0</option>
                                    <option value="20.0.0">20.0.0</option>
                                </optgroup>
                                <optgroup label="Modern">
                                    <option value="1.20.6">1.20.6</option>
                                    <option value="1.19.4">1.19.4</option>
                                    <option value="1.16.5">1.16.5</option>
                                </optgroup>
                                <optgroup label="Klasik & İlk Sürümler">
                                    <option value="1.8.9">1.8.9</option>
                                    <option value="1.5.2">1.5.2</option>
                                    <option value="1.0">1.0 (Başlangıç)</option>
                                </optgroup>
                            </select>
                        </div>
                    </div>

                    <div class="space-y-2">
                        <label class="block text-sm font-medium text-slate-300">İstediğiniz Alan Adı</label>
                        <div class="flex">
                            <input type="text" id="domain-sub-input" required placeholder="umutsmp" class="flex-grow bg-slate-900 border border-slate-700 rounded-l-xl px-4 py-3 text-white focus:outline-none focus:border-green-500">
                            <span class="bg-slate-800 border border-l-0 border-slate-700 rounded-r-xl px-4 py-3 text-slate-400 text-sm flex items-center">.free.minehost.me</span>
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-green-500 hover:bg-green-400 text-slate-950 font-bold py-3.5 rounded-xl">Aşamayı Tamamla</button>
                </form>
            </div>
        </section>

        <section id="step-panel" class="hidden space-y-6">
            <div class="glass p-6 rounded-2xl flex justify-between items-center">
                <div>
                    <h2 id="panel-server-title" class="text-xl font-bold text-white">---</h2>
                    <p id="panel-server-domain" class="text-sm font-mono text-slate-400 mt-1">---</p>
                    <p id="panel-server-version" class="text-xs text-green-400 font-bold mt-1">Sürüm: --</p>
                </div>
                <span id="status-badge" class="px-3 py-1 rounded-full text-xs font-bold bg-slate-800 text-slate-400">Çevrimdışı</span>
            </div>

            <div id="queue-card" class="glass p-6 rounded-2xl border border-slate-800 space-y-5 hidden">
                <div class="text-center space-y-2">
                    <h3 class="font-bold text-white">Sıra Bekleniyor</h3>
                    <div class="bg-slate-900 p-4 rounded-xl">
                        <span id="queue-number" class="text-3xl font-black text-blue-400 font-mono">0</span>
                    </div>
                </div>
            </div>

            <div class="grid lg:grid-cols-3 gap-6">
                <div class="glass p-6 rounded-2xl border border-slate-800 space-y-4">
                    <button id="btn-start" onclick="startServer()" class="w-full bg-green-500 text-slate-950 font-bold py-3 rounded-xl">BAŞLAT</button>
                    <button id="btn-stop" onclick="stopServer()" class="w-full bg-slate-800 text-slate-500 font-bold py-3 rounded-xl cursor-not-allowed">DURDUR</button>
                </div>
                <div class="lg:col-span-2 glass p-5 rounded-2xl border border-slate-800 h-64 flex flex-col">
                    <div id="console-logs" class="flex-grow bg-slate-950 rounded-xl p-4 font-mono text-xs text-slate-300 overflow-y-auto"></div>
                </div>
            </div>
        </section>
    </main>

    <script src="sunucu.js"></script>
</body>
</html>
